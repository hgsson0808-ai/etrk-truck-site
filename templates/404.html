{% extends "base.html" %}
{% block title %}페이지를 찾을 수 없습니다 | __BRAND__{% endblock %}
{% block desc %}요청하신 페이지가 없거나 판매가 끝난 매물입니다.{% endblock %}
{% block main %}
<div class="wrap" style="padding-block:56px 72px">
  <h1 class="page-h">찾으시는 페이지가 없습니다</h1>
  <p class="lead">판매가 끝난 매물이거나 주소가 바뀌었습니다. 비슷한 차를 찾아 드릴 수 있으니 전화나 문자로 문의해 주세요.</p>
  <p style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px">
    <a class="btn btn-yellow" href="{{ list_file }}">전체 매물 보기</a>
    <a class="btn btn-ghost" href="tel:{{ site.phone_tel }}">{{ site.phone }} 전화 상담</a>
  </p>
</div>
{% endblock %}
